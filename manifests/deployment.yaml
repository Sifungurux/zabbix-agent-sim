apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-agent-sim
  namespace: zabbix
  labels:
    app: zabbix-agent-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-agent-sim
  template:
    metadata:
      labels:
        app: zabbix-agent-sim
    spec:
      containers:
      - name: zabbix-agent-sim
        image: zabbix-agent-sim:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 10050
          name: agent
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-agent-sim
  namespace: zabbix
  labels:
    app: zabbix-agent-sim
spec:
  selector:
    app: zabbix-agent-sim
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
